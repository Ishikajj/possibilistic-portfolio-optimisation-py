[project]
name = "possibilistic-portfolio-optimisation-py"
version = "0.1.0"
description = "Possibilistic portfolio optimisation in Python"
requires-python = ">=3.11,<3.14"

# runtime deps
dependencies = [
    "ipykernel>=7.2.0",
    "jinja2>=3.1.6",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# project name possibilistic-portfolio-optimisation-py would map to a
# different module name; the code lives in src/possibilistic_portfolio/
module-name = "possibilistic_portfolio"

[dependency-groups]
dev = [
    "ruff",
    "pandas-stubs>=3.0.0.260204",
    "pytest>=9.2.0",
    "scipy-stubs>=1.17.1.5",
]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, numpy-specific rules
select = ["E", "W", "F", "I", "UP", "B", "NPY"]
ignore = [
    "E501",  # line length is the formatter's job
    "B905",  # zip() without strict= — only used in plotting, mismatches are harmless
]

[tool.pyright]
# Read by Pylance in VS Code
typeCheckingMode = "basic"
exclude = ["archive"]  # unused old code

[tool.pytest.ini_options]
testpaths = ["tests"]  # the package is installed into the venv (uv sync)
