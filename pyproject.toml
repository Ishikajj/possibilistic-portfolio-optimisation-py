[project]
name = "possibilistic-portfolio-optimisation-py"
version = "0.1.0"
description = "Possibilistic portfolio optimisation in Python"
requires-python = ">=3.11,<3.14"

# runtime deps
dependencies = [
    "ipykernel>=7.2.0",
    "jinja2>=3.1.6",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ruff",
    "pandas-stubs>=3.0.0.260204",
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, numpy-specific rules
select = ["E", "W", "F", "I", "UP", "B", "NPY"]
ignore = [
    "E501",  # line length is the formatter's job
    "B905",  # zip() without strict= — only used in plotting, mismatches are harmless
]

[tool.pyright]
# Read by Pylance in VS Code
typeCheckingMode = "basic"

[tool.pytest.ini_options]
  testpaths = ["tests"]   # where your tests live
  pythonpath = ["src"]