[project]
name = "possibilistic-portfolio-optimisation-py"
version = "0.1.0"
description = "Possibilistic portfolio optimisation in Python"
requires-python = ">=3.11,<3.14"

# runtime deps
dependencies = [
    "ipykernel>=7.2.0",
    "jinja2>=3.1.6",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "mypy>=1.19.1",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pandas-stubs>=3.0.0.260204",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
  "black",
  "flake8",
]

[tool.black]
line-length = 80
target-version = ["py311"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]

[tool.mypy]
follow_untyped_imports = true
